name: release

# A person pushes a v* tag after review. This builds the image for both
# platforms with the checked CLI release, pushes it to Docker Hub, and makes a
# draft GitHub release. The extension shows an update notice only after the
# draft is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v3
      - run: make cli-release
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the image
        run: |
          version=${GITHUB_REF_NAME#v}
          # One build with both tags, so that :latest has the same digest as the version.
          docker buildx build --push --platform linux/amd64,linux/arm64 --sbom=true --provenance=true \
            --build-arg EXTENSION_VERSION=$version \
            -t angelborroy/openarch-extension:$version -t angelborroy/openarch-extension:latest .
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
            --title "Docker Extension for OpenArch ${GITHUB_REF_NAME#v}"
