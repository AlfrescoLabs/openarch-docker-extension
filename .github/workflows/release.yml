name: release

# A person pushes a v* tag after review. This builds the image for both
# platforms with the checked CLI release, and pushes it to Docker Hub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v3
      - run: make cli-release
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the image
        run: |
          version=${GITHUB_REF_NAME#v}
          make push TAG=$version
          docker buildx build --push --platform linux/amd64,linux/arm64 --sbom=true --provenance=true \
            --build-arg EXTENSION_VERSION=$version -t alfrescolabs/openarch-docker-extension:latest .
